  Please assess causality for this adverse event (drug identity blinded):

  Subject: {{subject_id}}
  Dose Level: {{dose_level}}

  Adverse Event:
  - Term: {{ae_term}}
  - CTCAE Grade: {{ctcae_grade}}
  - Onset: {{ae_onset}}
  - Duration: {{ae_duration}}
  - Outcome: {{ae_outcome}}
  - Serious: {{ae_serious}}

  Disease Status:
  - Tumor type: {{tumor_type}}
  - Disease stage: {{disease_stage}}
  - Last RECIST assessment: {{last_recist}}

  Note: Drug identity and mechanism are blinded due to confidentiality.
